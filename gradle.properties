org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m
kotlin.native.ignoreDisabledTargets=true
kotlin.code.style=official
displayFullTestPath=true
android.useAndroidX=true
# `kiteimage-compose` and `material-kolor` are published with `minCompileSdk=37`, but this APK is
# built and distributed locally against the installed android-36 platform, so the AAR metadata
# check only blocks a build that is otherwise fine. Their actual API use stays below 36.
android.experimental.disableCompileSdkChecks=true
