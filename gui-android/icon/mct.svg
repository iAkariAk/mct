<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Full-bleed background; the adaptive icon's own background layer paints the same colour, so
       this rect only matters for the legacy mipmap fallback. -->
  <rect width="108" height="108" fill="#14532D"/>

  <!-- Artwork inside the adaptive safe zone: a 66/108 circle, so everything is scaled and centred
       to survive the mask without its edges being cropped. -->
  <g transform="translate(54,54) scale(1.18) translate(-54,-54)">
    <!-- Source world: a Minecraft block. -->
    <path d="M32 18 L54 29 L32 40 L10 29 Z" fill="#7DD3A0"/>
    <path d="M10 29 L32 40 L32 62 L10 51 Z" fill="#4CAF87"/>
    <path d="M54 29 L54 51 L32 62 L32 40 Z" fill="#2E8B62"/>

    <!-- Extracted text lines. -->
    <rect x="66" y="20" width="30" height="8" rx="3" fill="#FFFFFF"/>
    <rect x="66" y="34" width="21" height="8" rx="3" fill="#FFFFFF"/>
    <rect x="66" y="48" width="30" height="8" rx="3" fill="#FFFFFF"/>

    <!-- Out: text leaves the world; In: the translation returns. -->
    <path d="M36 56 h12 v5 h-12 z" fill="#FCD34D"/>
    <path d="M48 52 l9 6.5 l-9 6.5 z" fill="#FCD34D"/>
    <path d="M66 74 h-14 v5 h14 z" fill="#7DD3A0"/>
    <path d="M52 70 l-9 6.5 l9 6.5 z" fill="#7DD3A0"/>
  </g>
</svg>
